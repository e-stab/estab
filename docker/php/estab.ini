expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

default_charset = "UTF-8"
date.timezone = "Europe/Berlin"
auto_prepend_file = "/var/www/html/app/bootstrap.php"

allow_url_include = Off
cgi.fix_pathinfo = 0
file_uploads = On
; PHP's transport ceiling stays above the application's configurable limit.
; This lets eStab return the complete unsaved Nachrichtenvordruck with a
; useful validation error instead of PHP discarding all multipart fields.
upload_max_filesize = 50M
post_max_size = 56M
max_execution_time = 120
max_input_time = 120
; Die teuerste Handlung ist die PDF-Ausgabe des Einsatzdossiers; gemessen
; erreicht sie 65 MB Spitze (FPDF haelt das ganze Dokument im Speicher --
; alle Seiteninhalte im Feld und noch einmal im Ausgabepuffer). 128 MB
; lassen das Doppelte an Luft. 256 MB waren auf einem Geraetebudget von
; 1 GB keine Grenze, sondern eine Einladung.
memory_limit = 128M

session.save_path = "/var/lib/php/sessions"
session.gc_maxlifetime = 43200
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
; Gemessen belegt: 17,6 MB Code, 4,5 MB Zeichenketten. Der Gewinn ist
; ueberwiegend Adressraum, nicht belegter Speicher -- aber ein Wert, der
; das Siebenfache des Bedarfs reserviert, sagt nichts ueber den Bedarf.
opcache.memory_consumption = 48
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
