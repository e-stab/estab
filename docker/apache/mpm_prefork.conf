# Der Deckel fuer Apache.
#
# Die Debian-Vorgabe erlaubt 150 gleichzeitige Arbeitsprozesse. Zusammen mit
# einem memory_limit von 128 MB sind das rechnerisch 19 GB -- praktisch
# heisst es, dass es keine Zahl gibt, unterhalb derer der Dienst garantiert
# bleibt. Auf einem Geraet mit 1 GB Budget fuer eStab entscheidet dann der
# Kernel per OOM-Killer, welcher Dienst stirbt, und das ist im Zweifel die
# Datenbank mitten im Einsatz.
#
# Gemessene Last: 0,15 Anfragen je Sekunde. Zwoelf Arbeitsprozesse tragen
# auch zwanzig Arbeitsplaetze im 30-Sekunden-Takt. Ab zwoelf gleichzeitigen
# Anfragen entsteht eine Warteschlange -- das ist die gewollte Wirkung: Ein
# Wartender ist besser als ein neu gestarteter Dienst.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        12

    # Ohne diese Zeile (Vorgabe 0) gibt ein Arbeitsprozess seinen Heap bis
    # zum Neustart des Containers nie zurueck. Was er einmal angefordert
    # hat, bleibt belegt.
    MaxConnectionsPerChild   500
</IfModule>
