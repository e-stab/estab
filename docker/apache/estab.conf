ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^/health\.php$" healthcheck_request
    CustomLog /proc/self/fd/1 combined env=!healthcheck_request

    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AcceptPathInfo Off
        AllowOverride None
        Require all granted
    </Directory>

    # No PHP endpoint accepts a second routing path after its script name.
    # Besides removing ambiguous legacy routing, this prevents a public script
    # from borrowing an authorization-looking /4fadm or /4fbak suffix.
    <LocationMatch "(?i)\.php/">
        Require all denied
    </LocationMatch>

    # Runtime internals and configuration are never web resources.
    <DirectoryMatch "^/var/www/html/(?:app|docker|4fcfg)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    # Administration remains available, but is protected independently from
    # the legacy application session mechanism. The historical graphic reset
    # lives below /4fach, so it must share the same explicit boundary.
    <LocationMatch "(?i)^/(?:4fadm(?:/|$)|4fach/resetpic\.php$)">
        AuthType Basic
        AuthName "eStab Administration"
        AuthBasicProvider file
        AuthUserFile /run/estab-auth/admin.htpasswd
        Require valid-user
    </LocationMatch>

    # Files in the backup tree are runtime libraries and filesystem-only
    # generators. Apache must never execute or serve them directly; PHP
    # require/include calls are unaffected by this URL boundary.
    <LocationMatch "(?i)^/4fbak(?:/|$)">
        Require all denied
    </LocationMatch>

    # Legacy controllers and helper libraries are included by mainindex.php.
    # Calling them as standalone scripts bypasses the supported workflow,
    # authentication context or output boundary.
    <LocationMatch "(?i)^/4fach/(?:4fachform|color\.inc|data_hndl|data_hndl_gespr_A|data_hndl_gespr_E|db_operation|dummy|katego|liste|logoff|menue|navi|protokoll|stab_status|tools|tools_neu|topmenue|upload_class|vali_data)\.php(?:/|$)">
        Require all denied
    </LocationMatch>

    # Translation arrays, abandoned demonstrations and obsolete admin
    # generators are implementation files, not HTTP endpoints.
    <LocationMatch "(?i)^/language/german/(?:form|helptextold|hilfetext|mennu)\.php(?:/|$)">
        Require all denied
    </LocationMatch>
    <Location "/ubltg/js_windowtwar.php">
        Require all denied
    </Location>
    <LocationMatch "(?i)^/4fadm/(?:usermgr|db_generator)\.php(?:/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)\.inc\.php(?:/|$)">
        Require all denied
    </LocationMatch>

    # These unlinked legacy views bypass current incident/duty/object
    # authorization. They are not part of the supported runtime surface.
    <LocationMatch "(?i)^/4fach/(?:all_msg|counter|status)\.php$">
        Require all denied
    </LocationMatch>

    # Only the explicit compatibility tombstone upload/upload.php remains
    # reachable and returns HTTP 410. Every other historical helper below this
    # directory exposed unsafe uploads, request dumps or example data.
    <LocationMatch "(?i)^/4fach/upload/(?!upload\.php$)">
        Require all denied
    </LocationMatch>

    # This is an internal print library, not a supported web endpoint.
    # PHPrint.php historically accepted a path and evaluated embedded code.
    <LocationMatch "(?i)^/4fach/Print(?:/|$)">
        Require all denied
    </LocationMatch>

    # Historical provisioning/config writers are replaced by environment and
    # the MariaDB init script. Diagnostic, sample and unsafe batch endpoints
    # must not be callable in production.
    <LocationMatch "(?i)^/(?:4fadm/(?:create_db|create_dir|db_check|make_conf|phpinfo)|4fach/(?:create_db|create_dir|test)|4fach/css/test|4fach/Print/lpr_example|4fach/upload/(?:upload_example|multiple_upload_example))\.php$">
        Require all denied
    </LocationMatch>

    <FilesMatch "(?i)^(?:\.ht|\.env|config|dbcfg|e_cfg).*$">
        Require all denied
    </FilesMatch>

    <FilesMatch "(?i)\.(?:inc|ini|log|md|sh|sql|yml|yaml)$">
        Require all denied
    </FilesMatch>

    # The legacy naming convention puts a second ".php" suffix after ".inc".
    # Such files remain usable through filesystem includes only.
    <FilesMatch "(?i)\.inc\.php$">
        Require all denied
    </FilesMatch>

    # Attachments and generated forms are delivered only by the authenticated
    # PHP boundary. No byte below 4fdata is a direct HTTP resource.
    <Directory /var/www/html/4fdata>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
    </Directory>

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    # Statische Auslieferungen bekommen die strengste Fassung: sie fuehren
    # kein Skript aus. Jede von PHP erzeugte Seite ersetzt diesen Kopf durch
    # ihre eigene Fassung mit einer Nonce je Anfrage (app/csp.php) -- der
    # Webserver kann keine unratbare Nonce erzeugen.
    #
    # style-src behaelt 'unsafe-inline' mit Absicht: die Listen faerben eine
    # Zeile nach der Durchschrift, die die lesende Funktion erreicht. Das ist
    # Datum, nicht Markup, und eine Nonce deckt Stilattribute ohnehin nicht ab.
    # Ausfuehren laesst sich damit nichts.
    # Diese Fassung gilt fuer alles, was NICHT von PHP kommt: statische
    # Auslieferungen und Apache-eigene Fehlerseiten fuehren kein Skript aus.
    #
    # Die Bedingung ist noetig, nicht kosmetisch. "set" wuerde die Nonce der
    # Anfrage ueberschreiben; ein bedingungsloses "setifempty" haengt eine
    # ZWEITE Richtlinie an die PHP-Antwort, und mehrere Richtlinien gelten
    # gemeinsam -- script-src 'none' wuerde dann jedes eigene Skript
    # blockieren. Nur die Pruefung auf eine bereits gesetzte Kopfzeile
    # liefert in allen drei Faellen genau eine.
    Header always setifempty Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'" "expr=-z %{resp:Content-Security-Policy}"
</VirtualHost>
