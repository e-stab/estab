# The upstream MariaDB 11.8.8 image embeds gosu 1.19, built with Go 1.24.6.
# Trivy reports vulnerabilities in Go standard-library packages by version,
# even though gosu is a local uid/gid switcher and does not invoke the affected
# TLS, HTTP, mail, DNS, URL, or os.Root parsing code paths. The migration image
# removes this unused binary; the database image still needs it in its official
# entrypoint. Every exception is path-bound and expires, forcing a new review
# or an upstream image/gosu update.
vulnerabilities:
  - id: CVE-2025-68121
    paths: [usr/local/bin/gosu]
    expired_at: 2026-10-31
    statement: Affected crypto/tls code is unreachable in the local gosu uid/gid switcher.
  - id: CVE-2025-61726
    paths: [usr/local/bin/gosu]
    expired_at: 2026-10-31
    statement: Affected net/url query parsing is unreachable in gosu.
  - id: CVE-2025-61729
    paths: [usr/local/bin/gosu]
    expired_at: 2026-10-31
    statement: Affected crypto/x509 code is unreachable in gosu.
