name: Publish OCI images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing Git tag and immutable OCI tag for both images
        required: true
        type: string
      redistribution_cleared:
        description: Rights and license review for all shipped assets is complete
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Publishing is serialized across every ref. Two dispatches must never race for
# the same immutable registry tags.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            browser: required
          - arch: arm64
            runner: ubuntu-24.04-arm
            browser: skip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      COMPOSE_PROJECT_NAME: estab_ci_publish_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.arch }}
      ESTAB_HTTP_PORT: "18080"
      RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
      REDISTRIBUTION_CLEARED: ${{ inputs.redistribution_cleared }}
      CONTAINER_PUBLISH_ENABLED: ${{ vars.ESTAB_CONTAINER_PUBLISH_ENABLED }}
      PUBLISH_REVIEWER_CONFIGURED: ${{ vars.ESTAB_CONTAINER_PUBLISH_REVIEWER_CONFIGURED }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate manual release gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REPOSITORY" != "e-stab/estab" ]]; then
            echo "Publishing is restricted to e-stab/estab." >&2
            exit 1
          fi
          if [[ "$CONTAINER_PUBLISH_ENABLED" != "true" ]]; then
            echo "Repository variable ESTAB_CONTAINER_PUBLISH_ENABLED is not true." >&2
            exit 1
          fi
          if [[ "$PUBLISH_REVIEWER_CONFIGURED" != "true" ]]; then
            echo "Required-reviewer configuration has not been confirmed." >&2
            exit 1
          fi
          if [[ "$REDISTRIBUTION_CLEARED" != "true" ]]; then
            echo "Rights and license review has not been confirmed." >&2
            exit 1
          fi
          if [[ "$RELEASE_REF_TYPE" != "tag" || "$RELEASE_REF_NAME" != "$RELEASE_IMAGE_TAG" ]]; then
            echo "Dispatch the workflow from the existing Git tag named by image_tag." >&2
            exit 1
          fi
          if [[ "$RELEASE_IMAGE_TAG" == "latest" ]]; then
            echo "The mutable latest tag is deliberately unsupported." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Image tag must be a lowercase OCI-compatible release tag." >&2
            exit 1
          fi

      - name: Run complete fresh-stack release gate
        timeout-minutes: 52
        env:
          ESTAB_CI_LOG_DIR: ${{ runner.temp }}/estab-ci-logs
          ESTAB_BROWSER_TEST: ${{ matrix.browser }}
        run: bash tests/integration/ci.sh

      - name: Scan application image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-app:latest
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan migration image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-migrate:latest
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Scan database image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/mariadb@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
          exit-code: "1"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-ci-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified image pair
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: container-publish
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      APP_IMAGE: ghcr.io/e-stab/estab
      MIGRATE_IMAGE: ghcr.io/e-stab/estab-migrate
      RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      # Both images must compile for both target architectures before the first
      # registry mutation. The later push steps reuse these verified caches.
      - name: Prebuild application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab
          cache-to: type=gha,mode=max,scope=estab

      - name: Prebuild migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/db/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab-migrate
          cache-to: type=gha,mode=max,scope=estab-migrate

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable tags
        shell: bash
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$MIGRATE_IMAGE"; do
            if output=$(docker buildx imagetools inspect \
                "$image:$RELEASE_IMAGE_TAG" 2>&1); then
              echo "Refusing to overwrite existing image tag: $image:$RELEASE_IMAGE_TAG" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$output"; then
              echo "Could not prove that $image:$RELEASE_IMAGE_TAG is absent:" >&2
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done

      - name: Publish application image
        id: push_app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.RELEASE_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab
          cache-to: type=gha,mode=max,scope=estab

      - name: Publish migration image
        id: push_migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/db/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}:${{ env.RELEASE_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab-migrate
          cache-to: type=gha,mode=max,scope=estab-migrate

      - name: Attest application image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.push_app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest migration image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.MIGRATE_IMAGE }}
          subject-digest: ${{ steps.push_migrate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify manifests and attestations
        shell: bash
        env:
          APP_DIGEST: ${{ steps.push_app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
        run: |
          set -euo pipefail
          verify_index() {
            local image=$1
            local digest=$2
            local manifest
            local platform
            local sbom
            local provenance
            manifest=$(docker buildx imagetools inspect "$image@$digest" --raw)
            jq -e '
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "amd64"
              )] | length) == 1
              and
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "arm64"
              )] | length) == 1
            ' <<<"$manifest" >/dev/null
            for platform in linux/amd64 linux/arm64; do
              sbom=$(docker buildx imagetools inspect "$image@$digest" \
                --format "{{ json (index .SBOM \"$platform\").SPDX }}")
              jq -e '
                .SPDXID == "SPDXRef-DOCUMENT"
                and (.spdxVersion | startswith("SPDX-"))
                and (.packages | type == "array" and length > 0)
              ' <<<"$sbom" >/dev/null
              provenance=$(docker buildx imagetools inspect "$image@$digest" \
                --format "{{ json (index .Provenance \"$platform\").SLSA }}")
              jq -e --arg platform "$platform" '
                (.buildType | type == "string" and length > 0)
                and (.builder.id | type == "string")
                and .invocation.environment.platform == $platform
              ' <<<"$provenance" >/dev/null
            done
            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          }
          verify_index "$APP_IMAGE" "$APP_DIGEST"
          verify_index "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"

      - name: Build immutable installation bundle
        id: bundle
        shell: bash
        env:
          APP_DIGEST: ${{ steps.push_app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
        run: |
          set -euo pipefail
          bundle_name="estab-${RELEASE_IMAGE_TAG}"
          bundle_root="$RUNNER_TEMP/$bundle_name"
          install -d -m 0755 "$bundle_root"
          cp deploy/registry/compose.yaml "$bundle_root/compose.yaml"
          sed \
            's#../../docs/BACKUP-UND-WIEDERHERSTELLUNG.md#BACKUP-UND-WIEDERHERSTELLUNG.md#g' \
            deploy/registry/README.md >"$bundle_root/README.md"
          cp deploy/registry/verify-backup.sh "$bundle_root/verify-backup.sh"
          sed \
            -e 's#^backup_verifier=deploy/registry/verify-backup.sh$#backup_verifier=./verify-backup.sh#' \
            -e "s#(TESTS-UND-MONITORING.md)#(https://github.com/e-stab/estab/blob/$GITHUB_SHA/docs/TESTS-UND-MONITORING.md)#" \
            docs/BACKUP-UND-WIEDERHERSTELLUNG.md \
            >"$bundle_root/BACKUP-UND-WIEDERHERSTELLUNG.md"
          awk \
            -v app="$APP_IMAGE@$APP_DIGEST" \
            -v migrate="$MIGRATE_IMAGE@$MIGRATE_DIGEST" '
              /^ESTAB_APP_IMAGE=/ {
                print "ESTAB_APP_IMAGE=" app
                next
              }
              /^ESTAB_MIGRATE_IMAGE=/ {
                print "ESTAB_MIGRATE_IMAGE=" migrate
                next
              }
              { print }
            ' deploy/registry/.env.example >"$bundle_root/.env.example"
          {
            printf 'Git-Tag: %s\n' "$RELEASE_IMAGE_TAG"
            printf 'Git-Commit: %s\n' "$GITHUB_SHA"
            printf 'App-Image: %s@%s\n' "$APP_IMAGE" "$APP_DIGEST"
            printf 'Migrator-Image: %s@%s\n' "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"
          } >"$bundle_root/RELEASE"
          (
            cd "$bundle_root"
            sha256sum -- * .env.example >SHA256SUMS
          )
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$bundle_name.tar.gz" \
            "$bundle_name"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$bundle_name.tar.gz" \
              >"$bundle_name.tar.gz.sha256"
          )
          {
            echo "bundle_name=$bundle_name"
            echo "bundle_path=$RUNNER_TEMP/$bundle_name.tar.gz"
            echo "checksum_path=$RUNNER_TEMP/$bundle_name.tar.gz.sha256"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Verifiziertes eStab-Imagepaar"
            echo
            echo "- App: \`$APP_IMAGE@$APP_DIGEST\`"
            echo "- Migrator: \`$MIGRATE_IMAGE@$MIGRATE_DIGEST\`"
            echo "- Installationspaket: \`$bundle_name.tar.gz\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish immutable installation bundle
        shell: bash
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle_path }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum_path }}
          APP_DIGEST: ${{ steps.push_app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_IMAGE_TAG" >/dev/null 2>&1; then
            existing_assets=$(gh release view "$RELEASE_IMAGE_TAG" \
              --json assets --jq '.assets[].name')
            for asset_name in \
              "$BUNDLE_NAME.tar.gz" \
              "$BUNDLE_NAME.tar.gz.sha256"
            do
              if printf '%s\n' "$existing_assets" |
                  grep -Fqx "$asset_name"; then
                echo "Refusing to overwrite existing release asset: $asset_name" >&2
                exit 1
              fi
            done
          else
            notes="$RUNNER_TEMP/release-notes.md"
            {
              echo "Verifiziertes eStab-Containerpaar für linux/amd64 und linux/arm64."
              echo
              echo "- App: \`$APP_IMAGE@$APP_DIGEST\`"
              echo "- Migrator: \`$MIGRATE_IMAGE@$MIGRATE_DIGEST\`"
              echo
              echo "Das Installationspaket enthält Compose, eine bereits auf beide"
              echo "Manifest-Digests gebundene Konfigurationsvorlage, Runbook und"
              echo "den prüfsummengebundenen Backup-Verifier."
              echo
              echo "Vor dem Entpacken:"
              echo "\`sha256sum --check $BUNDLE_NAME.tar.gz.sha256\`"
            } >"$notes"
            gh release create "$RELEASE_IMAGE_TAG" \
              --verify-tag \
              --title "eStab $RELEASE_IMAGE_TAG" \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_IMAGE_TAG" \
            "$BUNDLE_PATH" "$CHECKSUM_PATH"
