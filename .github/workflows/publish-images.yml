name: Publish OCI images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing protected Git tag used for the digest-only release
        required: true
        type: string
      redistribution_cleared:
        description: Rights and license review for all shipped assets is complete
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Publishing is serialized across every ref. Image publication itself is
# digest-only; the protected Git tag and immutable GitHub Release name the pair.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate manual release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: container-publish
    env:
      RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
      REDISTRIBUTION_CLEARED: ${{ inputs.redistribution_cleared }}
      CONTAINER_PUBLISH_ENABLED: ${{ vars.ESTAB_CONTAINER_PUBLISH_ENABLED }}
      PUBLISH_REVIEWER_CONFIGURED: ${{ vars.ESTAB_CONTAINER_PUBLISH_REVIEWER_CONFIGURED }}
      RELEASE_TAG_RULESET_ID: ${{ vars.ESTAB_RELEASE_TAG_RULESET_ID }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate repository, tag, rights, and reviewer gates
        shell: bash
        env:
          RELEASE_POLICY_TOKEN: ${{ secrets.ESTAB_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REPOSITORY" != "e-stab/estab" ]]; then
            echo "Publishing is restricted to e-stab/estab." >&2
            exit 1
          fi
          if [[ "$CONTAINER_PUBLISH_ENABLED" != "true" ]]; then
            echo "Repository variable ESTAB_CONTAINER_PUBLISH_ENABLED is not true." >&2
            exit 1
          fi
          if [[ "$PUBLISH_REVIEWER_CONFIGURED" != "true" ]]; then
            echo "Required-reviewer configuration has not been confirmed." >&2
            exit 1
          fi
          if [[ "$REDISTRIBUTION_CLEARED" != "true" ]]; then
            echo "Rights and license review has not been confirmed." >&2
            exit 1
          fi
          if [[ -z "$RELEASE_POLICY_TOKEN" ]]; then
            echo "ESTAB_RELEASE_POLICY_TOKEN is not configured." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "ESTAB_RELEASE_TAG_RULESET_ID is not configured as a positive ruleset ID." >&2
            exit 1
          fi
          for redistribution_file in LICENSE THIRD_PARTY_NOTICES.md; do
            if [[ ! -s "$redistribution_file" ]]; then
              echo "Required redistribution artifact is missing or empty: $redistribution_file" >&2
              exit 1
            fi
          done
          if [[ "$RELEASE_REF_TYPE" != "tag" || "$RELEASE_REF_NAME" != "$RELEASE_IMAGE_TAG" ]]; then
            echo "Dispatch the workflow from the existing Git tag named by image_tag." >&2
            exit 1
          fi
          if [[ "$RELEASE_IMAGE_TAG" == "latest" ]]; then
            echo "The mutable latest tag is deliberately unsupported." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Image tag must be a lowercase OCI-compatible release tag." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$RELEASE_IMAGE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "The selected Git tag does not resolve to the checked-out commit." >&2
            exit 1
          fi
          GH_TOKEN="$RELEASE_POLICY_TOKEN" \
            tools/verify-github-release-policy.sh \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_IMAGE_TAG" \
              "$GITHUB_SHA" \
              "$RELEASE_TAG_RULESET_ID" \
              >"$RUNNER_TEMP/github-release-policy-preflight.json"

  stage:
    name: Build digest-only image pair
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: container-publish
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      app_digest: ${{ steps.push_app.outputs.digest }}
      migrate_digest: ${{ steps.push_migrate.outputs.digest }}
    env:
      APP_IMAGE: ghcr.io/e-stab/estab
      MIGRATE_IMAGE: ghcr.io/e-stab/estab-migrate
      RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if release_output=$(gh release view "$RELEASE_IMAGE_TAG" 2>&1); then
            echo "Refusing to reuse existing GitHub release: $RELEASE_IMAGE_TAG" >&2
            exit 1
          fi
          if ! grep -Eqi 'release not found|not found.*HTTP 404|HTTP 404.*not found' \
              <<<"$release_output"; then
            echo "Could not prove that GitHub release $RELEASE_IMAGE_TAG is absent:" >&2
            printf '%s\n' "$release_output" >&2
            exit 1
          fi

      # BuildKit pushes each index by content digest without creating or
      # overwriting any mutable OCI tag.
      - name: Push application index by digest
        id: push_app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_IMAGE_TAG }}
            org.opencontainers.image.licenses=GPL-3.0-only
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab
          cache-to: type=gha,mode=max,scope=estab

      - name: Push migration index by digest
        id: push_migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/db/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.MIGRATE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_IMAGE_TAG }}
            org.opencontainers.image.licenses=GPL-3.0-only
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=estab-migrate
          cache-to: type=gha,mode=max,scope=estab-migrate

      - name: Attest application image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.push_app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest migration image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.MIGRATE_IMAGE }}
          subject-digest: ${{ steps.push_migrate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify digest-only indexes and build evidence
        shell: bash
        env:
          APP_DIGEST: ${{ steps.push_app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
        run: |
          set -euo pipefail
          verify_index() {
            local image=$1
            local digest=$2
            local manifest
            local platform
            local sbom
            local provenance
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Build did not return a valid index digest for $image." >&2
              exit 1
            fi
            manifest=$(docker buildx imagetools inspect "$image@$digest" --raw)
            jq -e '
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "amd64"
              )] | length) == 1
              and
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "arm64"
              )] | length) == 1
            ' <<<"$manifest" >/dev/null
            for platform in linux/amd64 linux/arm64; do
              sbom=$(docker buildx imagetools inspect "$image@$digest" \
                --format "{{ json (index .SBOM \"$platform\").SPDX }}")
              jq -e '
                .SPDXID == "SPDXRef-DOCUMENT"
                and (.spdxVersion | startswith("SPDX-"))
                and (.packages | type == "array" and length > 0)
              ' <<<"$sbom" >/dev/null
              provenance=$(docker buildx imagetools inspect "$image@$digest" \
                --format "{{ json (index .Provenance \"$platform\").SLSA }}")
              jq -e --arg platform "$platform" '
                (.buildType | type == "string" and length > 0)
                and (.builder.id | type == "string")
                and .invocation.environment.platform == $platform
              ' <<<"$provenance" >/dev/null
            done
            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
              --bundle-from-oci \
              --source-digest "$GITHUB_SHA" >/dev/null
          }
          verify_index "$APP_IMAGE" "$APP_DIGEST"
          verify_index "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"

  verify_candidate:
    name: Verify exact release digests (${{ matrix.arch }})
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            browser: required
          - arch: arm64
            runner: ubuntu-24.04-arm
            browser: skip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      APP_IMAGE: ghcr.io/e-stab/estab
      MIGRATE_IMAGE: ghcr.io/e-stab/estab-migrate
      APP_DIGEST: ${{ needs.stage.outputs.app_digest }}
      MIGRATE_DIGEST: ${{ needs.stage.outputs.migrate_digest }}
      COMPOSE_PROJECT_NAME: estab_ci_publish_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.arch }}
      ESTAB_HTTP_PORT: "18080"
      ESTAB_BROWSER_TEST: ${{ matrix.browser }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify exact native image digests
        shell: bash
        env:
          ESTAB_PREBUILT_APP_IMAGE: ${{ env.APP_IMAGE }}@${{ env.APP_DIGEST }}
          ESTAB_PREBUILT_MIGRATE_IMAGE: ${{ env.MIGRATE_IMAGE }}@${{ env.MIGRATE_DIGEST }}
          ESTAB_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/estab-release-evidence
        run: |
          bash tests/integration/verify_release_candidate.sh \
            "${{ matrix.arch }}" \
            "$ESTAB_PREBUILT_APP_IMAGE" \
            "$ESTAB_PREBUILT_MIGRATE_IMAGE" \
            "$ESTAB_RELEASE_EVIDENCE_DIR"

      - name: Run complete fresh-stack gate against exact digests
        timeout-minutes: 55
        env:
          ESTAB_PREBUILT_APP_IMAGE: ${{ env.APP_IMAGE }}@${{ env.APP_DIGEST }}
          ESTAB_PREBUILT_MIGRATE_IMAGE: ${{ env.MIGRATE_IMAGE }}@${{ env.MIGRATE_DIGEST }}
          ESTAB_CI_LOG_DIR: ${{ runner.temp }}/estab-ci-logs
        run: bash tests/integration/ci.sh

      - name: Scan exact application digest for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.APP_IMAGE }}@${{ env.APP_DIGEST }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: ${{ runner.temp }}/estab-release-evidence/trivy-app.txt
          exit-code: "1"

      - name: Scan exact migration digest for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.MIGRATE_IMAGE }}@${{ env.MIGRATE_DIGEST }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: ${{ runner.temp }}/estab-release-evidence/trivy-migrate.txt
          skip-setup-trivy: true
          exit-code: "1"

      - name: Scan exact database image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/mariadb@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          output: ${{ runner.temp }}/estab-release-evidence/trivy-db.txt
          skip-setup-trivy: true
          exit-code: "1"

      - name: Finalize successful architecture evidence
        shell: bash
        env:
          ESTAB_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/estab-release-evidence
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/estab-ci-logs/prebuilt-images.env"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/app-index.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/migrate-index.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/app-native-manifest.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/migrate-native-manifest.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/app-sbom.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/migrate-sbom.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/app-provenance.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/migrate-provenance.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/app-attestation.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/migrate-attestation.json"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/trivy-app.txt"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/trivy-migrate.txt"
          test -f "$ESTAB_RELEASE_EVIDENCE_DIR/trivy-db.txt"
          cp -a "$RUNNER_TEMP/estab-ci-logs" \
            "$ESTAB_RELEASE_EVIDENCE_DIR/ci"
          {
            printf 'result=passed\n'
            printf 'architecture=%s\n' '${{ matrix.arch }}'
            printf 'browser_gate=%s\n' '${{ matrix.browser }}'
            printf 'registry_publication=digest-only\n'
            printf 'integration_gate=passed\n'
            printf 'vulnerability_gate=passed\n'
            printf 'attestation_gate=passed\n'
            printf 'verified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"$ESTAB_RELEASE_EVIDENCE_DIR/result.env"
          checksums_tmp=$(mktemp "$RUNNER_TEMP/estab-release-sha.XXXXXX")
          trap 'rm -f -- "$checksums_tmp"' EXIT
          (
            cd "$ESTAB_RELEASE_EVIDENCE_DIR"
            find . -type f ! -name SHA256SUMS -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum
          ) >"$checksums_tmp"
          mv -- "$checksums_tmp" \
            "$ESTAB_RELEASE_EVIDENCE_DIR/SHA256SUMS"
          trap - EXIT
          (
            cd "$ESTAB_RELEASE_EVIDENCE_DIR"
            sha256sum --check SHA256SUMS
          )

      - name: Upload successful architecture evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/estab-ci-logs
            ${{ runner.temp }}/estab-release-evidence
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish verified digests and installation bundle
    needs:
      - stage
      - verify_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: container-publish
    permissions:
      actions: read
      contents: write
      packages: read
      attestations: read
    env:
      APP_IMAGE: ghcr.io/e-stab/estab
      MIGRATE_IMAGE: ghcr.io/e-stab/estab-migrate
      APP_DIGEST: ${{ needs.stage.outputs.app_digest }}
      MIGRATE_DIGEST: ${{ needs.stage.outputs.migrate_digest }}
      RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
      RELEASE_TAG_RULESET_ID: ${{ vars.ESTAB_RELEASE_TAG_RULESET_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and validate native release evidence
        shell: bash
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/estab-${{ inputs.image_tag }}-evidence
        run: |
          set -euo pipefail
          test ! -e "$RELEASE_EVIDENCE_DIR"
          install -d -m 0755 "$RELEASE_EVIDENCE_DIR/architectures"
          cp deploy/registry/RELEASE-EVIDENCE.md \
            "$RELEASE_EVIDENCE_DIR/README.md"

          verify_architecture_evidence() {
            local architecture=$1
            local evidence_dir="$RELEASE_EVIDENCE_DIR/architectures/$architecture"
            local artifact_name
            artifact_name="publish-evidence-${architecture}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            install -d -m 0755 "$evidence_dir"
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$evidence_dir"
            (
              cd "$evidence_dir"
              sha256sum --check SHA256SUMS
            )
            grep -Fqx 'result=passed' "$evidence_dir/result.env"
            grep -Fqx "architecture=$architecture" "$evidence_dir/result.env"
            grep -Fqx "git_commit=$GITHUB_SHA" "$evidence_dir/candidate.env"
            grep -Fqx "reference=$APP_IMAGE@$APP_DIGEST" \
              "$evidence_dir/app-image.env"
            grep -Fqx "reference=$MIGRATE_IMAGE@$MIGRATE_DIGEST" \
              "$evidence_dir/migrate-image.env"
            test "sha256:$(sha256sum "$evidence_dir/app-index.json" |
              awk '{ print $1 }')" = "$APP_DIGEST"
            test "sha256:$(sha256sum "$evidence_dir/migrate-index.json" |
              awk '{ print $1 }')" = "$MIGRATE_DIGEST"
          }

          verify_architecture_evidence amd64
          verify_architecture_evidence arm64

      - name: Recheck digest availability and GitHub release policy
        shell: bash
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/estab-${{ inputs.image_tag }}-evidence
          RELEASE_POLICY_TOKEN: ${{ secrets.ESTAB_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          for digest in "$APP_DIGEST" "$MIGRATE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Stage output is not a valid image digest." >&2
              exit 1
            fi
          done
          docker buildx imagetools inspect "$APP_IMAGE@$APP_DIGEST" \
            >/dev/null
          docker buildx imagetools inspect "$MIGRATE_IMAGE@$MIGRATE_DIGEST" \
            >/dev/null
          if release_output=$(gh release view "$RELEASE_IMAGE_TAG" 2>&1); then
            echo "Refusing to reuse existing GitHub release: $RELEASE_IMAGE_TAG" >&2
            exit 1
          fi
          if ! grep -Eqi 'release not found|not found.*HTTP 404|HTTP 404.*not found' \
              <<<"$release_output"; then
            echo "Could not prove that GitHub release $RELEASE_IMAGE_TAG is absent:" >&2
            printf '%s\n' "$release_output" >&2
            exit 1
          fi
          trust_dir="$RELEASE_EVIDENCE_DIR/trust"
          install -d -m 0755 "$trust_dir"
          GH_TOKEN="$RELEASE_POLICY_TOKEN" \
            tools/verify-github-release-policy.sh \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_IMAGE_TAG" \
              "$GITHUB_SHA" \
              "$RELEASE_TAG_RULESET_ID" \
              >"$trust_dir/github-policy-before-draft.json"
          gh attestation trusted-root >"$trust_dir/trusted-root.jsonl"
          test -s "$trust_dir/trusted-root.jsonl"

          verify_and_record_attestation() {
            local role=$1
            local image=$2
            local digest=$3
            local online_result="$trust_dir/$role-online-verification.json"
            local bundle="$trust_dir/$role-attestations.jsonl"
            local offline_result="$trust_dir/$role-offline-verification.json"
            local index_file
            index_file="$RELEASE_EVIDENCE_DIR/architectures/amd64/$role-index.json"

            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
              --bundle-from-oci \
              --source-digest "$GITHUB_SHA" \
              --format=json >"$online_result"
            jq -e '
              type == "array" and length > 0
              and all(.[];
                (.attestation | type == "object")
                and (.verificationResult | type == "object")
              )
            ' "$online_result" >/dev/null
            jq -c '.[].attestation' "$online_result" >"$bundle"
            test -s "$bundle"

            # The raw OCI index bytes hash to the published image digest. This
            # permits a real bundle/root verification without registry access.
            test "sha256:$(sha256sum "$index_file" |
              awk '{ print $1 }')" = "$digest"
            gh attestation verify "$index_file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
              --bundle "$bundle" \
              --custom-trusted-root "$trust_dir/trusted-root.jsonl" \
              --source-digest "$GITHUB_SHA" \
              --format=json >"$offline_result"
            jq -e 'type == "array" and length > 0' \
              "$offline_result" >/dev/null
          }

          verify_and_record_attestation app "$APP_IMAGE" "$APP_DIGEST"
          verify_and_record_attestation migrate \
            "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'git_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow=%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'online_bundle_from_oci=passed\n'
            printf 'local_bundle_with_release_trusted_root=passed\n'
          } >"$trust_dir/policy.env"

      - name: Build immutable installation bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_name="estab-${RELEASE_IMAGE_TAG}"
          bundle_root="$RUNNER_TEMP/$bundle_name"
          install -d -m 0755 "$bundle_root"
          cp deploy/registry/compose.yaml "$bundle_root/compose.yaml"
          sed \
            's#../../docs/BACKUP-UND-WIEDERHERSTELLUNG.md#BACKUP-UND-WIEDERHERSTELLUNG.md#g' \
            deploy/registry/README.md >"$bundle_root/README.md"
          cp deploy/registry/backup.sh "$bundle_root/backup.sh"
          cp deploy/registry/deploy.sh "$bundle_root/deploy.sh"
          cp deploy/registry/restore.sh "$bundle_root/restore.sh"
          cp deploy/registry/verify-backup.sh "$bundle_root/verify-backup.sh"
          cp deploy/registry/verify-release.sh "$bundle_root/verify-release.sh"
          cp deploy/registry/offline-images.sh "$bundle_root/offline-images.sh"
          cp deploy/registry/RELEASE-EVIDENCE.md \
            "$bundle_root/RELEASE-EVIDENCE.md"
          cp LICENSE THIRD_PARTY_NOTICES.md "$bundle_root/"
          sed \
            -e 's#deploy/registry/backup.sh#./backup.sh#g' \
            -e 's#deploy/registry/verify-backup.sh#./verify-backup.sh#g' \
            -e 's#deploy/registry/restore.sh#./restore.sh#g' \
            docs/BACKUP-UND-WIEDERHERSTELLUNG.md \
            >"$bundle_root/BACKUP-UND-WIEDERHERSTELLUNG.md"
          awk \
            -v app="$APP_IMAGE@$APP_DIGEST" \
            -v migrate="$MIGRATE_IMAGE@$MIGRATE_DIGEST" '
              /^ESTAB_APP_IMAGE=/ {
                print "ESTAB_APP_IMAGE=" app
                next
              }
              /^ESTAB_MIGRATE_IMAGE=/ {
                print "ESTAB_MIGRATE_IMAGE=" migrate
                next
              }
              { print }
            ' deploy/registry/.env.example >"$bundle_root/.env.example"
          {
            printf 'Git-Tag: %s\n' "$RELEASE_IMAGE_TAG"
            printf 'Git-Commit: %s\n' "$GITHUB_SHA"
            printf 'App-Image: %s@%s\n' "$APP_IMAGE" "$APP_DIGEST"
            printf 'Migrator-Image: %s@%s\n' "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"
          } >"$bundle_root/RELEASE"
          (
            cd "$bundle_root"
            sha256sum -- * .env.example >SHA256SUMS
          )
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$bundle_name.tar.gz" \
            "$bundle_name"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$bundle_name.tar.gz" \
              >"$bundle_name.tar.gz.sha256"
          )
          {
            echo "bundle_name=$bundle_name"
            echo "bundle_path=$RUNNER_TEMP/$bundle_name.tar.gz"
            echo "checksum_path=$RUNNER_TEMP/$bundle_name.tar.gz.sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Create and verify the complete release draft
        id: release_draft
        shell: bash
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle_path }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum_path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}-evidence
        run: |
          set -Eeuo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          release_name="eStab $RELEASE_IMAGE_TAG"
          owned_release_identity="$RUNNER_TEMP/owned-release-identity.json"
          owned_release_assets_dir="$RUNNER_TEMP/owned-release-assets"
          expected_release_assets="$RUNNER_TEMP/owned-release-assets.json"
          install -d -m 0700 "$owned_release_assets_dir"
          {
            echo "Verifiziertes eStab-Containerpaar für linux/amd64 und linux/arm64."
            echo
            echo "- App: \`$APP_IMAGE@$APP_DIGEST\`"
            echo "- Migrator: \`$MIGRATE_IMAGE@$MIGRATE_DIGEST\`"
            echo
            echo "Das Installationspaket enthält Compose, eine bereits auf beide"
            echo "Manifest-Digests gebundene Konfigurationsvorlage, Runbook und"
            echo "den prüfsummengebundenen Backup-Verifier."
            echo "Das separate Evidence-Archiv bewahrt SBOM, Provenance,"
            echo "Attestationsbundles und beide nativen Testergebnisse dauerhaft."
            echo
            echo "Vor dem Entpacken:"
            echo "\`sha256sum --check $BUNDLE_NAME.tar.gz.sha256\`"
            echo "\`sha256sum --check $BUNDLE_NAME-evidence.tar.gz.sha256\`"
          } >"$notes"

          create_request="$RUNNER_TEMP/create-release.json"
          created_release="$RUNNER_TEMP/created-release.json"
          jq -n \
            --arg tag "$RELEASE_IMAGE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg name "$release_name" \
            --rawfile body "$notes" '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: true,
              prerelease: false,
              generate_release_notes: false,
              make_latest: "false"
            }' >"$create_request"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input "$create_request" >"$created_release"
          owned_release_id=$(jq -r '.id // empty' "$created_release")
          if [[ ! "$owned_release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Created draft release has no valid exact database ID." >&2
            exit 1
          fi
          printf 'release_id=%s\n' "$owned_release_id" >>"$GITHUB_OUTPUT"
          jq '{
            id,
            node_id,
            created_at,
            author: {
              id: .author.id,
              node_id: .author.node_id,
              login: .author.login
            }
          }' "$created_release" >"$owned_release_identity"

          verify_owned_release_metadata() {
            local release_json=$1
            local expected_draft=$2
            jq -e \
              --argjson id "$owned_release_id" \
              --arg tag "$RELEASE_IMAGE_TAG" \
              --arg target "$GITHUB_SHA" \
              --arg name "$release_name" \
              --argjson draft "$expected_draft" \
              --rawfile body "$notes" \
              --slurpfile identity "$owned_release_identity" '
                .id == $id
                and {
                  id,
                  node_id,
                  created_at,
                  author: {
                    id: .author.id,
                    node_id: .author.node_id,
                    login: .author.login
                  }
                } == $identity[0]
                and (.node_id | type == "string" and length > 0)
                and (.created_at | type == "string" and length > 0)
                and (.author.id | type == "number" and . > 0)
                and (.author.node_id | type == "string" and length > 0)
                and (.author.login | type == "string" and length > 0)
                and .tag_name == $tag
                and .target_commitish == $target
                and .name == $name
                and .body == $body
                and .draft == $draft
                and .prerelease == false
                and (
                  if $draft
                  then .immutable == false and .published_at == null
                  else true
                  end
                )
              ' "$release_json" >/dev/null
          }

          upload_owned_release_asset() {
            local asset_path=$1
            local asset_name
            local asset_response
            local expected_digest
            local expected_size
            asset_name=$(basename -- "$asset_path")
            if [[ ! "$asset_name" =~ ^[a-z0-9][a-z0-9._-]{0,254}$ ]] ||
                [[ ! -f "$asset_path" ]] ||
                [[ -L "$asset_path" ]]; then
              echo "Refusing unsafe release asset: $asset_path" >&2
              exit 1
            fi
            asset_response="$owned_release_assets_dir/$asset_name.json"
            expected_digest="sha256:$(sha256sum "$asset_path" |
              awk '{ print $1 }')"
            expected_size=$(wc -c <"$asset_path" | tr -d '[:space:]')
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset_path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$owned_release_id/assets?name=$asset_name" \
              >"$asset_response"
            jq -e \
              --arg name "$asset_name" \
              --arg digest "$expected_digest" \
              --argjson size "$expected_size" '
                (.id | type == "number" and . > 0)
                and .name == $name
                and .state == "uploaded"
                and .size == $size
                and .digest == $digest
              ' "$asset_response" >/dev/null
          }

          refresh_and_verify_owned_release() {
            local current_release=$RUNNER_TEMP/current-owned-release.json
            jq -s '
              map({
                id,
                name,
                state,
                size,
                digest
              }) | sort_by(.name)
            ' "$owned_release_assets_dir"/*.json >"$expected_release_assets"
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/$owned_release_id" \
              >"$current_release"
            verify_owned_release_metadata "$current_release" true
            jq -e --slurpfile expected "$expected_release_assets" '
              ([.assets[] | {
                id,
                name,
                state,
                size,
                digest
              }] | sort_by(.name)) == $expected[0]
            ' "$current_release" >/dev/null
          }

          download_owned_release_asset() {
            local asset_name=$1
            local destination=$2
            local asset_id
            local download_tmp
            asset_id=$(jq -r --arg name "$asset_name" '
              .[] | select(.name == $name) | .id
            ' "$expected_release_assets")
            if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Expected release asset has no exact database ID: $asset_name" >&2
              exit 1
            fi
            download_tmp=$(mktemp "$RUNNER_TEMP/estab-release-asset.XXXXXX")
            curl --fail --silent --show-error --location \
              --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --output "$download_tmp"
            mv -- "$download_tmp" "$destination"
          }

          verify_owned_release_metadata "$created_release" true
          jq -e '.assets == []' "$created_release" >/dev/null
          upload_owned_release_asset "$BUNDLE_PATH"
          upload_owned_release_asset "$CHECKSUM_PATH"
          refresh_and_verify_owned_release

          verification_dir=$(mktemp -d "$RUNNER_TEMP/estab-release-verify.XXXXXX")
          download_owned_release_asset \
            "$BUNDLE_NAME.tar.gz" \
            "$verification_dir/$BUNDLE_NAME.tar.gz"
          download_owned_release_asset \
            "$BUNDLE_NAME.tar.gz.sha256" \
            "$verification_dir/$BUNDLE_NAME.tar.gz.sha256"
          cmp "$CHECKSUM_PATH" \
            "$verification_dir/$BUNDLE_NAME.tar.gz.sha256"
          (
            cd "$verification_dir"
            sha256sum --check "$BUNDLE_NAME.tar.gz.sha256"
            tar -xzf "$BUNDLE_NAME.tar.gz"
            cd "$BUNDLE_NAME"
            sha256sum --check SHA256SUMS
          )

          install -d -m 0755 "$RELEASE_EVIDENCE_DIR"
          {
            printf 'git_tag=%s\n' "$RELEASE_IMAGE_TAG"
            printf 'git_commit=%s\n' "$GITHUB_SHA"
            printf 'app_reference=%s@%s\n' "$APP_IMAGE" "$APP_DIGEST"
            printf 'migrate_reference=%s@%s\n' "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"
            printf 'bundle_sha256=%s\n' \
              "$(sha256sum "$BUNDLE_PATH" | awk '{ print $1 }')"
          } >"$RELEASE_EVIDENCE_DIR/publication.env"
          cp "$verification_dir/$BUNDLE_NAME.tar.gz.sha256" \
            "$RELEASE_EVIDENCE_DIR/"
          (
            cd "$RELEASE_EVIDENCE_DIR"
            {
              printf 'Format: estab-release-evidence-v1\n'
              printf 'Git-Tag: %s\n' "$RELEASE_IMAGE_TAG"
              printf 'Git-Commit: %s\n' "$GITHUB_SHA"
              printf 'App-Image: %s@%s\n' "$APP_IMAGE" "$APP_DIGEST"
              printf 'Migrator-Image: %s@%s\n' \
                "$MIGRATE_IMAGE" "$MIGRATE_DIGEST"
              printf 'Installationsarchiv: %s.tar.gz\n' "$BUNDLE_NAME"
              printf 'Workflow: %s/%s/actions/runs/%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } >EVIDENCE
            checksums_tmp=$(mktemp \
              "$RUNNER_TEMP/estab-permanent-evidence-sha.XXXXXX")
            trap 'rm -f -- "$checksums_tmp"' EXIT
            find . -type f ! -path './SHA256SUMS' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum >"$checksums_tmp"
            mv -- "$checksums_tmp" SHA256SUMS
            trap - EXIT
            sha256sum --check SHA256SUMS
          )
          evidence_name="$BUNDLE_NAME-evidence"
          evidence_path="$RUNNER_TEMP/$evidence_name.tar.gz"
          evidence_checksum_path="$evidence_path.sha256"
          tar -C "$RUNNER_TEMP" -czf "$evidence_path" "$evidence_name"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$evidence_name.tar.gz" \
              >"$evidence_name.tar.gz.sha256"
          )

          upload_owned_release_asset "$evidence_path"
          upload_owned_release_asset "$evidence_checksum_path"
          refresh_and_verify_owned_release

          permanent_evidence_check=$(mktemp -d \
            "$RUNNER_TEMP/estab-evidence-verify.XXXXXX")
          download_owned_release_asset \
            "$evidence_name.tar.gz" \
            "$permanent_evidence_check/$evidence_name.tar.gz"
          download_owned_release_asset \
            "$evidence_name.tar.gz.sha256" \
            "$permanent_evidence_check/$evidence_name.tar.gz.sha256"
          cmp "$evidence_checksum_path" \
            "$permanent_evidence_check/$evidence_name.tar.gz.sha256"
          (
            cd "$permanent_evidence_check"
            sha256sum --check "$evidence_name.tar.gz.sha256"
            tar -xzf "$evidence_name.tar.gz"
            cd "$evidence_name"
            sha256sum --check SHA256SUMS
            test -s trust/app-online-verification.json
            test -s trust/migrate-online-verification.json
            test -s trust/app-attestations.jsonl
            test -s trust/migrate-attestations.jsonl
            test -s architectures/amd64/app-sbom.json
            test -s architectures/arm64/app-sbom.json
            grep -Fqx 'result=passed' architectures/amd64/result.env
            grep -Fqx 'result=passed' architectures/arm64/result.env
          )
          refresh_and_verify_owned_release

      - name: Upload publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-${{ inputs.image_tag }}-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Make the fully verified draft visible
        shell: bash
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle_path }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum_path }}
          EVIDENCE_NAME: ${{ steps.bundle.outputs.bundle_name }}-evidence
          EVIDENCE_PATH: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}-evidence.tar.gz
          EVIDENCE_CHECKSUM_PATH: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}-evidence.tar.gz.sha256
          OWNED_RELEASE_ID: ${{ steps.release_draft.outputs.release_id }}
          RELEASE_POLICY_TOKEN: ${{ secrets.ESTAB_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          release_name="eStab $RELEASE_IMAGE_TAG"
          owned_release_identity="$RUNNER_TEMP/owned-release-identity.json"
          expected_release_assets="$RUNNER_TEMP/owned-release-assets.json"
          if [[ ! "$OWNED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] ||
              [[ ! -s "$owned_release_identity" ]] ||
              [[ ! -s "$expected_release_assets" ]] ||
              [[ ! -s "$notes" ]]; then
            echo "The exact owned draft identity is unavailable." >&2
            exit 1
          fi

          verify_owned_release() {
            local release_json=$1
            local expected_draft=$2
            jq -e \
              --argjson id "$OWNED_RELEASE_ID" \
              --arg tag "$RELEASE_IMAGE_TAG" \
              --arg target "$GITHUB_SHA" \
              --arg name "$release_name" \
              --argjson draft "$expected_draft" \
              --rawfile body "$notes" \
              --slurpfile identity "$owned_release_identity" \
              --slurpfile expected_assets "$expected_release_assets" '
                .id == $id
                and {
                  id,
                  node_id,
                  created_at,
                  author: {
                    id: .author.id,
                    node_id: .author.node_id,
                    login: .author.login
                  }
                } == $identity[0]
                and (.node_id | type == "string" and length > 0)
                and (.created_at | type == "string" and length > 0)
                and (.author.id | type == "number" and . > 0)
                and (.author.node_id | type == "string" and length > 0)
                and (.author.login | type == "string" and length > 0)
                and .tag_name == $tag
                and .target_commitish == $target
                and .name == $name
                and .body == $body
                and .draft == $draft
                and .prerelease == false
                and (
                  if $draft
                  then .immutable == false and .published_at == null
                  else (.published_at | type == "string" and length > 0)
                  end
                )
                and (
                  [.assets[] | {
                    id,
                    name,
                    state,
                    size,
                    digest
                  }] | sort_by(.name)
                ) == $expected_assets[0]
              ' "$release_json" >/dev/null
          }

          refresh_owned_release() {
            local expected_draft=$1
            local destination=$2
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" \
              >"$destination"
            verify_owned_release "$destination" "$expected_draft"
          }

          download_owned_release_asset() {
            local asset_name=$1
            local destination=$2
            local asset_id
            local download_tmp
            asset_id=$(jq -r --arg name "$asset_name" '
              .[] | select(.name == $name) | .id
            ' "$expected_release_assets")
            if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Expected release asset has no exact database ID: $asset_name" >&2
              exit 1
            fi
            download_tmp=$(mktemp "$RUNNER_TEMP/estab-release-asset.XXXXXX")
            curl --fail --silent --show-error --location \
              --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --output "$download_tmp"
            mv -- "$download_tmp" "$destination"
          }

          release_state="$RUNNER_TEMP/owned-release-before-publish.json"
          refresh_owned_release true "$release_state"
          final_asset_check=$(mktemp -d "$RUNNER_TEMP/estab-release-final-check.XXXXXX")
          download_owned_release_asset \
            "$BUNDLE_NAME.tar.gz" \
            "$final_asset_check/$BUNDLE_NAME.tar.gz"
          download_owned_release_asset \
            "$BUNDLE_NAME.tar.gz.sha256" \
            "$final_asset_check/$BUNDLE_NAME.tar.gz.sha256"
          download_owned_release_asset \
            "$EVIDENCE_NAME.tar.gz" \
            "$final_asset_check/$EVIDENCE_NAME.tar.gz"
          download_owned_release_asset \
            "$EVIDENCE_NAME.tar.gz.sha256" \
            "$final_asset_check/$EVIDENCE_NAME.tar.gz.sha256"
          cmp "$CHECKSUM_PATH" \
            "$final_asset_check/$BUNDLE_NAME.tar.gz.sha256"
          cmp "$EVIDENCE_CHECKSUM_PATH" \
            "$final_asset_check/$EVIDENCE_NAME.tar.gz.sha256"
          (
            cd "$final_asset_check"
            sha256sum --check "$BUNDLE_NAME.tar.gz.sha256"
            sha256sum --check "$EVIDENCE_NAME.tar.gz.sha256"
            tar -xzf "$EVIDENCE_NAME.tar.gz"
            (
              cd "$EVIDENCE_NAME"
              sha256sum --check SHA256SUMS
            )
          )
          docker buildx imagetools inspect "$APP_IMAGE@$APP_DIGEST" \
            >/dev/null
          docker buildx imagetools inspect "$MIGRATE_IMAGE@$MIGRATE_DIGEST" \
            >/dev/null
          gh attestation verify "oci://$APP_IMAGE@$APP_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
            "$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
            --bundle-from-oci \
            --source-digest "$GITHUB_SHA" >/dev/null
          gh attestation verify "oci://$MIGRATE_IMAGE@$MIGRATE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
            "$GITHUB_REPOSITORY/.github/workflows/publish-images.yml" \
            --bundle-from-oci \
            --source-digest "$GITHUB_SHA" >/dev/null
          refresh_owned_release true "$release_state"
          GH_TOKEN="$RELEASE_POLICY_TOKEN" \
            tools/verify-github-release-policy.sh \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_IMAGE_TAG" \
              "$GITHUB_SHA" \
              "$RELEASE_TAG_RULESET_ID" \
              >"$RUNNER_TEMP/github-policy-before-publish.json"
          publish_request="$RUNNER_TEMP/publish-owned-release.json"
          published_response="$RUNNER_TEMP/published-owned-release.json"
          jq -n \
            --arg tag "$RELEASE_IMAGE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg name "$release_name" \
            --rawfile body "$notes" '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false,
              make_latest: "false"
            }' >"$publish_request"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" \
            --input "$publish_request" >"$published_response"
          verify_owned_release "$published_response" false
          published_state=
          published_state_verified=false
          for attempt in {1..12}; do
            if published_state=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" 2>&1) &&
                verify_owned_release <(printf '%s\n' "$published_state") false &&
                jq -e '.immutable == true' \
                  <<<"$published_state" >/dev/null 2>&1; then
              published_state_verified=true
              break
            fi
            if ((attempt < 12)); then
              sleep 5
            fi
          done
          if [[ "$published_state_verified" != true ]]; then
            echo "Published release did not become immutable with the exact assets." >&2
            printf '%s\n' "$published_state" >&2
            exit 1
          fi
          tag_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_IMAGE_TAG")
          jq -e --argjson id "$OWNED_RELEASE_ID" '.id == $id' \
            <<<"$tag_release" >/dev/null
          release_attestation_verified=false
          release_verification_error="$RUNNER_TEMP/github-release-attestation.stderr"
          for attempt in {1..12}; do
            if gh release verify \
                "$RELEASE_IMAGE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --format json \
                >"$RUNNER_TEMP/github-release-attestation.json" \
                2>"$release_verification_error"; then
              release_attestation_verified=true
              break
            fi
            if ((attempt < 12)); then
              sleep 5
            fi
          done
          if [[ "$release_attestation_verified" != true ]]; then
            echo "Published immutable release attestation did not verify." >&2
            cat "$release_verification_error" >&2
            exit 1
          fi
          jq -e 'type == "object" or type == "array"' \
            "$RUNNER_TEMP/github-release-attestation.json" >/dev/null
          asset_attestation_dir="$RUNNER_TEMP/github-release-asset-attestations"
          install -d -m 0755 "$asset_attestation_dir"
          for verified_asset in \
              "$BUNDLE_PATH" \
              "$CHECKSUM_PATH" \
              "$EVIDENCE_PATH" \
              "$EVIDENCE_CHECKSUM_PATH"
          do
            verified_asset_name=$(basename -- "$verified_asset")
            gh release verify-asset \
              "$RELEASE_IMAGE_TAG" \
              "$verified_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --format json \
              >"$asset_attestation_dir/$verified_asset_name.json"
            jq -e 'type == "object" or type == "array"' \
              "$asset_attestation_dir/$verified_asset_name.json" >/dev/null
          done
          GH_TOKEN="$RELEASE_POLICY_TOKEN" \
            tools/verify-github-release-policy.sh \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_IMAGE_TAG" \
              "$GITHUB_SHA" \
              "$RELEASE_TAG_RULESET_ID" \
              >"$RUNNER_TEMP/github-policy-after-publish.json"
          {
            echo "### Verifiziertes eStab-Imagepaar"
            echo
            echo "- App: \`$APP_IMAGE@$APP_DIGEST\`"
            echo "- Migrator: \`$MIGRATE_IMAGE@$MIGRATE_DIGEST\`"
            echo "- Installationspaket: \`$BUNDLE_NAME.tar.gz\`"
            echo "- Dauerhafte Evidence: \`$EVIDENCE_NAME.tar.gz\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain final GitHub publication policy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-publication-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-policy-before-publish.json
            ${{ runner.temp }}/github-policy-after-publish.json
            ${{ runner.temp }}/github-release-attestation.json
            ${{ runner.temp }}/github-release-asset-attestations
          if-no-files-found: error
          retention-days: 90

      - name: Delete only this run's still-private draft after failure
        if: ${{ failure() && steps.release_draft.outputs.release_id != '' }}
        shell: bash
        env:
          OWNED_RELEASE_ID: ${{ steps.release_draft.outputs.release_id }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          release_name="eStab $RELEASE_IMAGE_TAG"
          owned_release_identity="$RUNNER_TEMP/owned-release-identity.json"
          current_release="$RUNNER_TEMP/owned-release-cleanup-check.json"
          if [[ ! "$OWNED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] ||
              [[ ! -s "$owned_release_identity" ]] ||
              [[ ! -s "$notes" ]]; then
            echo "::warning::Exact owned-draft identity is unavailable; refusing cleanup."
            exit 0
          fi
          if ! gh api \
              "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" \
              >"$current_release"; then
            echo "::warning::Owned release is absent or unreadable; no cleanup performed."
            exit 0
          fi
          if ! jq -e \
              --argjson id "$OWNED_RELEASE_ID" \
              --arg tag "$RELEASE_IMAGE_TAG" \
              --arg target "$GITHUB_SHA" \
              --arg name "$release_name" \
              --rawfile body "$notes" \
              --slurpfile identity "$owned_release_identity" '
                .id == $id
                and {
                  id,
                  node_id,
                  created_at,
                  author: {
                    id: .author.id,
                    node_id: .author.node_id,
                    login: .author.login
                  }
                } == $identity[0]
                and (.node_id | type == "string" and length > 0)
                and (.created_at | type == "string" and length > 0)
                and (.author.id | type == "number" and . > 0)
                and (.author.node_id | type == "string" and length > 0)
                and (.author.login | type == "string" and length > 0)
                and .tag_name == $tag
                and .target_commitish == $target
                and .name == $name
                and .body == $body
                and .draft == true
                and .prerelease == false
                and .immutable == false
                and .published_at == null
              ' "$current_release" >/dev/null; then
            echo "::warning::Release is no longer the exact private draft created by this run; refusing cleanup."
            exit 0
          fi
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/$OWNED_RELEASE_ID" \
            >/dev/null
          echo "::notice::Deleted this failed run's exact private draft release."
