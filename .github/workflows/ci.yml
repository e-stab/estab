name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-static:
    name: PHP 8.5 static suite
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run PHP 8.5 suite
        run: >-
          docker run --rm --pull=always
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          php:8.5.8-cli-trixie@sha256:58b996c35ce0511cdbaa1fc0476a194fd0221097d721ff7df5af0b6f1a3d0202
          tests/static/run.sh

  compose-integration:
    name: Fresh Docker Compose integration
    needs: php-static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: estab_ci_${{ github.run_id }}_${{ github.run_attempt }}
      ESTAB_HTTP_PORT: "18080"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show container tooling
        run: |
          docker version
          docker compose version

      - name: Run fresh-stack integration
        timeout-minutes: 40
        env:
          ESTAB_CI_LOG_DIR: ${{ runner.temp }}/estab-ci-logs
          ESTAB_BROWSER_TEST: required
        run: bash tests/integration/ci.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-ci-logs
          if-no-files-found: ignore
          retention-days: 7
