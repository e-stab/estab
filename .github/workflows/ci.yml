name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  merge_group:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-static:
    name: PHP 8.5 static suite
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        id: actionlint
        continue-on-error: true
        run: >-
          docker run --rm --pull=always
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Verify source tree hygiene
        id: source_tree_hygiene
        continue-on-error: true
        run: sh tests/static/source_tree_hygiene.sh

      - name: Run PHP 8.5 suite
        id: php_static
        if: ${{ always() && steps.source_tree_hygiene.outcome == 'success' }}
        continue-on-error: true
        run: >-
          docker run --rm --pull=always
          --user 65534:65534
          --env ESTAB_SOURCE_TREE_HYGIENE_VERIFIED=1
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          php:8.5.8-cli-trixie@sha256:58b996c35ce0511cdbaa1fc0476a194fd0221097d721ff7df5af0b6f1a3d0202
          tests/static/run.sh

      - name: Install PDF render verification tools
        id: pdf_tools
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Render and compare both message-form PDF paths
        id: pdf_render
        if: always()
        continue-on-error: true
        env:
          ESTAB_PDF_EVIDENCE_DIR: ${{ runner.temp }}/estab-pdf-evidence
        run: |
          mkdir -p "$ESTAB_PDF_EVIDENCE_DIR"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$ESTAB_PDF_EVIDENCE_DIR:/evidence" \
            --workdir /workspace \
            php:8.5.8-cli-trixie@sha256:58b996c35ce0511cdbaa1fc0476a194fd0221097d721ff7df5af0b6f1a3d0202 \
            php tests/php/pdf_template_render_fixture.php /evidence
          bash tests/static/pdf_render.sh "$ESTAB_PDF_EVIDENCE_DIR"

      - name: Upload PDF render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pdf-render-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-pdf-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce static results
        if: always()
        shell: bash
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          SOURCE_TREE_HYGIENE_OUTCOME: ${{ steps.source_tree_hygiene.outcome }}
          PHP_STATIC_OUTCOME: ${{ steps.php_static.outcome }}
          PDF_TOOLS_OUTCOME: ${{ steps.pdf_tools.outcome }}
          PDF_RENDER_OUTCOME: ${{ steps.pdf_render.outcome }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name=$1
            local outcome=$2
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name concluded with $outcome."
              failed=1
            fi
          }

          require_success actionlint "$ACTIONLINT_OUTCOME"
          require_success source-tree-hygiene "$SOURCE_TREE_HYGIENE_OUTCOME"
          require_success php-static "$PHP_STATIC_OUTCOME"
          require_success pdf-tools "$PDF_TOOLS_OUTCOME"
          require_success pdf-render "$PDF_RENDER_OUTCOME"
          exit "$failed"

  playwright-e2e:
    name: Playwright message workflow
    needs: php-static
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: estab_e2e_${{ github.run_id }}_${{ github.run_attempt }}
      ESTAB_HTTP_PORT: "18081"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Playwright dependency
        run: npm ci --ignore-scripts

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated registration and message workflow
        env:
          ESTAB_CONTAINER_CLI: docker
          ESTAB_E2E_ARTIFACT_DIR: ${{ runner.temp }}/playwright-results
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: npm run test:e2e

      - name: Upload Playwright traces and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playwright-results
            ${{ runner.temp }}/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  compose-integration:
    name: Fresh Docker Compose integration (${{ matrix.arch }})
    needs: php-static
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            browser: required
          - arch: arm64
            runner: ubuntu-24.04-arm
            browser: skip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: estab_ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.arch }}
      ESTAB_HTTP_PORT: "18080"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show container tooling
        run: |
          docker version
          docker compose version

      - name: Run fresh-stack integration
        timeout-minutes: 50
        env:
          ESTAB_CI_LOG_DIR: ${{ runner.temp }}/estab-ci-logs
          ESTAB_BROWSER_TEST: ${{ matrix.browser }}
        run: bash tests/integration/ci.sh

      - name: Scan application image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-app:latest
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan migration image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-migrate:latest
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Scan database image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/mariadb@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
          exit-code: "1"

      - name: Upload integration evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/estab-ci-logs
          if-no-files-found: ignore
          retention-days: 14
