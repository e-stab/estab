name: Security and Quality Audit

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p audit-results

      - name: List largest tracked files
        shell: bash
        run: |
          set -euo pipefail

          git ls-files -z |
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              size=$(stat --format='%s' "$file")
              printf '%12d %s\n' "$size" "$file"
            fi
          done |
          sort -rn |
          head -200 |
          tee audit-results/largest-tracked-files.txt

      - name: Reject very large tracked files
        shell: bash
        run: |
          set -euo pipefail

          maximum_size=$((20 * 1024 * 1024))
          failed=0

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            size=$(stat --format='%s' "$file")

            if (( size > maximum_size )); then
              echo "::error file=$file::Tracked file is larger than 20 MiB: $size bytes"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"

      - name: Find unexpected binary files
        shell: bash
        run: |
          set -euo pipefail

          : > audit-results/binary-files.txt

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            mime=$(file --brief --mime-type "$file")

            case "$mime" in
              text/*|application/json|application/xml|application/javascript|application/x-empty)
                ;;
              image/*|font/*|application/pdf)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
              *)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
            esac
          done < <(git ls-files -z)

          cat audit-results/binary-files.txt

      - name: Find archives and executables
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Archives:"
            git ls-files |
              grep -Ei '\.(zip|tar|tgz|gz|bz2|xz|7z|rar|jar|war|phar)$' || true

            echo
            echo "Executable files:"
            git ls-files -s |
              awk '$1 == "100755" { print $4 }'
          } | tee audit-results/archives-and-executables.txt

      - name: Reject tracked dependency and build directories
        shell: bash
        run: |
          set -euo pipefail

          forbidden_pattern='(^|/)(node_modules|vendor|__pycache__|dist|build|coverage|\.pytest_cache|\.mypy_cache)(/|$)'

          matches=$(
            git ls-files |
            grep -E "$forbidden_pattern" || true
          )

          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Generated files or dependency directories are tracked."
            exit 1
          fi

      - name: Search for suspicious constructs
        shell: bash
        run: |
          set -euo pipefail

          pattern='
          (eval[[:space:]]*\()
          |(shell_exec[[:space:]]*\()
          |(passthru[[:space:]]*\()
          |(proc_open[[:space:]]*\()
          |(popen[[:space:]]*\()
          |(system[[:space:]]*\()
          |(exec[[:space:]]*\()
          |(base64_decode[[:space:]]*\()
          |(assert[[:space:]]*\()
          |(unserialize[[:space:]]*\()
          |(subprocess\.)
          |(os\.system[[:space:]]*\()
          |(child_process)
          |(Runtime\.getRuntime)
          |(ProcessBuilder)
          |(/etc/shadow)
          |(authorized_keys)
          |(crontab)
          |(systemctl)
          |(curl[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          |(wget[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          '

          compact_pattern=$(echo "$pattern" | tr -d '\n ')

          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=vendor \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            "$compact_pattern" . \
            | tee audit-results/suspicious-constructs.txt \
            || true

          echo
          echo "These findings require review and are not automatically vulnerabilities."

      - name: Upload repository reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-hygiene
          path: audit-results/
          retention-days: 14


  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        shell: bash
        run: |
          set -o pipefail

          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/php \
            --config p/python \
            --config p/javascript \
            --config p/bash \
            --config .semgrep/suspicious.yml \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 14

    permissions:
      contents: read
      security-events: write


  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: read
      pull-requests: read


  php:
    name: PHP audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect PHP project
        id: php
        shell: bash
        run: |
          if find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print -quit |
            grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.php.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2, phpstan, phpcs
          extensions: mbstring, json

      - name: Validate Composer configuration
        if: steps.php.outputs.present == 'true' && hashFiles('**/composer.json') != ''
        run: composer validate --strict

      - name: Install Composer dependencies safely
        if: steps.php.outputs.present == 'true' && hashFiles('composer.lock') != ''
        run: |
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --no-scripts

      - name: Check PHP syntax
        if: steps.php.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type f \
            -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 |
          xargs -0 -r -n1 php -l

      - name: Run PHPStan
        if: steps.php.outputs.present == 'true'
        run: |
          if [[ -f phpstan.neon || -f phpstan.neon.dist ]]; then
            phpstan analyse --no-progress
          else
            phpstan analyse \
              --no-progress \
              --level=5 \
              --memory-limit=1G \
              .
          fi

      - name: Run PHP_CodeSniffer
        if: steps.php.outputs.present == 'true'
        shell: bash
        run: |
          if [[ -f phpcs.xml || -f phpcs.xml.dist ]]; then
            phpcs
          else
            echo "::notice::No phpcs.xml found; PHPCS is not enforced yet."
          fi

      - name: Composer security audit
        if: steps.php.outputs.present == 'true' && hashFiles('composer.lock') != ''
        run: composer audit --locked --no-interaction


  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            {
              find . \
                -type f \
                \( -name '*.sh' -o -name '*.bash' -o -name '*.ksh' \) \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path './node_modules/*' \
                -print0

              git grep -Ilz '^#!.*\b\(ba\|da\|k\|z\)\?sh\b' -- \
                ':!vendor/**' \
                ':!node_modules/**' \
                || true
            } |
            sort -zu
          )

          if (( ${#files[@]} == 0 )); then
            echo "No shell scripts found."
            exit 0
          fi

          printf 'Checking %d shell files\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"


  python:
    name: Python audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect Python project
        id: python
        shell: bash
        run: |
          if find . -type f -name '*.py' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print -quit |
            grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install audit tools
        if: steps.python.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit pip-audit

      - name: Compile Python files
        if: steps.python.outputs.present == 'true'
        run: python -m compileall -q .

      - name: Run Ruff
        if: steps.python.outputs.present == 'true'
        run: ruff check .

      - name: Run Bandit
        if: steps.python.outputs.present == 'true'
        run: |
          bandit \
            --recursive . \
            --exclude './vendor,./node_modules,./.git,./tests' \
            --severity-level medium \
            --confidence-level medium

      - name: Audit Python dependencies
        if: steps.python.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(requirements*.txt)

          if (( ${#files[@]} == 0 )); then
            echo "::notice::No requirements files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Auditing $file"
            pip-audit --requirement "$file"
          done


  javascript:
    name: JavaScript audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect JavaScript project
        id: javascript
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.javascript.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        if: steps.javascript.outputs.present == 'true' && hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts

      - name: Audit npm dependencies
        if: steps.javascript.outputs.present == 'true' && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

      - name: Run lint script
        if: steps.javascript.outputs.present == 'true'
        shell: bash
        run: |
          if node -e '
            const packageFile = require("./package.json");
            process.exit(packageFile.scripts?.lint ? 0 : 1);
          '; then
            npm run lint
          else
            echo "::notice::No npm lint script configured."
          fi


  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        shell: bash
        run: |
          version="1.7.7"

          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_x86_64.tar.gz" \
            --output actionlint.tar.gz

          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color