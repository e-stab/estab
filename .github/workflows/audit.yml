name: Security and Quality Audit

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p audit-results

      - name: List largest tracked files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-results

          git ls-files -z |
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              size=$(stat --format='%s' "$file")
              printf '%12d %s\n' "$size" "$file"
            fi
          done |
          sort -rn > audit-results/largest-tracked-files.txt

          echo "Largest tracked files:"
          sed -n '1,200p' audit-results/largest-tracked-files.txt

      - name: Reject very large tracked files
        shell: bash
        run: |
          set -euo pipefail

          maximum_size=$((20 * 1024 * 1024))
          failed=0

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            size=$(stat --format='%s' "$file")

            if (( size > maximum_size )); then
              echo "::error file=$file::Tracked file is larger than 20 MiB: $size bytes"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"

      - name: Find unexpected binary files
        shell: bash
        run: |
          set -euo pipefail

          : > audit-results/binary-files.txt

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            mime=$(file --brief --mime-type "$file")

            case "$mime" in
              text/*|application/json|application/xml|application/javascript|application/x-empty)
                ;;
              image/*|font/*|application/pdf)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
              *)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
            esac
          done < <(git ls-files -z)

          cat audit-results/binary-files.txt

      - name: Find archives and executables
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Archives:"
            git ls-files |
              grep -Ei '\.(zip|tar|tgz|gz|bz2|xz|7z|rar|jar|war|phar)$' || true

            echo
            echo "Executable files:"
            git ls-files -s |
              awk '$1 == "100755" { print $4 }'
          } | tee audit-results/archives-and-executables.txt

      - name: Reject tracked dependency and build directories
        shell: bash
        run: |
          set -euo pipefail

          forbidden_pattern='(^|/)(node_modules|vendor|__pycache__|dist|build|coverage|\.pytest_cache|\.mypy_cache)(/|$)'

          matches=$(
            git ls-files |
            grep -E "$forbidden_pattern" || true
          )

          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Generated files or dependency directories are tracked."
            exit 1
          fi

      - name: Search for suspicious constructs
        shell: bash
        run: |
          set -euo pipefail

          pattern='
          (eval[[:space:]]*\()
          |(shell_exec[[:space:]]*\()
          |(passthru[[:space:]]*\()
          |(proc_open[[:space:]]*\()
          |(popen[[:space:]]*\()
          |(system[[:space:]]*\()
          |(exec[[:space:]]*\()
          |(base64_decode[[:space:]]*\()
          |(assert[[:space:]]*\()
          |(unserialize[[:space:]]*\()
          |(subprocess\.)
          |(os\.system[[:space:]]*\()
          |(child_process)
          |(Runtime\.getRuntime)
          |(ProcessBuilder)
          |(/etc/shadow)
          |(authorized_keys)
          |(crontab)
          |(systemctl)
          |(curl[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          |(wget[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          '

          compact_pattern=$(echo "$pattern" | tr -d '\n ')

          git grep -nI -E \
            "$compact_pattern" -- . \
            | tee audit-results/suspicious-constructs.txt \
            || true

          echo
          echo "These findings require review and are not automatically vulnerabilities."

      - name: Upload repository reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repository-hygiene
          path: audit-results/
          retention-days: 14


  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Semgrep
        run: pipx install semgrep==1.172.0

      - name: Run Semgrep
        shell: bash
        run: |
          set -o pipefail

          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/php \
            --config p/python \
            --config p/javascript \
            --config .semgrep/suspicious.yml \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 14

    permissions:
      contents: read
      security-events: write


  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect \
            --source=. \
            --verbose \
            --redact \
            --exit-code=1


  php:
    name: PHP audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PHP audit inputs
        id: php_inputs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print -quit |
            grep -q . || {
              echo "::error::No PHP source was found to audit."
              exit 1
            }

          test -f composer.json || {
            echo "::error file=composer.json::Required PHP manifest is missing."
            exit 1
          }
          test -f composer.lock || {
            echo "::error file=composer.lock::Required PHP lock file is missing."
            exit 1
          }
          jq -e '(.packages + .["packages-dev"] | length) > 0' \
            composer.lock >/dev/null || {
              echo "::error file=composer.lock::Composer audit graph is empty or invalid."
              exit 1
            }

      - name: Set up PHP
        id: php_setup
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
          extensions: fileinfo, gd, json, mbstring, mysqli, zip

      - name: Validate Composer configuration
        id: composer_validate
        if: always()
        continue-on-error: true
        run: composer validate --strict

      - name: Install Composer dependencies safely
        id: composer_install
        if: always()
        continue-on-error: true
        run: |
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --no-scripts

      - name: Check PHP syntax
        id: php_syntax
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type f \
            -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 |
          xargs -0 -r -n1 php -l

      - name: Run PHPStan
        id: phpstan
        if: always()
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run PHP_CodeSniffer
        id: phpcs
        if: always()
        continue-on-error: true
        run: vendor/bin/phpcs

      - name: Composer security audit
        id: composer_audit
        if: always()
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: Enforce PHP audit results
        if: always()
        shell: bash
        env:
          PHP_INPUTS_OUTCOME: ${{ steps.php_inputs.outcome }}
          PHP_SETUP_OUTCOME: ${{ steps.php_setup.outcome }}
          COMPOSER_VALIDATE_OUTCOME: ${{ steps.composer_validate.outcome }}
          COMPOSER_INSTALL_OUTCOME: ${{ steps.composer_install.outcome }}
          PHP_SYNTAX_OUTCOME: ${{ steps.php_syntax.outcome }}
          PHPSTAN_OUTCOME: ${{ steps.phpstan.outcome }}
          PHPCS_OUTCOME: ${{ steps.phpcs.outcome }}
          COMPOSER_AUDIT_OUTCOME: ${{ steps.composer_audit.outcome }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name=$1
            local outcome=$2
            if [[ "$outcome" != success ]]; then
              echo "::error::$name concluded with $outcome; success is required."
              failed=1
            fi
          }

          require_success php-inputs "$PHP_INPUTS_OUTCOME"
          require_success php-setup "$PHP_SETUP_OUTCOME"
          require_success composer-validate "$COMPOSER_VALIDATE_OUTCOME"
          require_success composer-install "$COMPOSER_INSTALL_OUTCOME"
          require_success php-syntax "$PHP_SYNTAX_OUTCOME"
          require_success phpstan "$PHPSTAN_OUTCOME"
          require_success phpcs "$PHPCS_OUTCOME"
          require_success composer-audit "$COMPOSER_AUDIT_OUTCOME"
          exit "$failed"


  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            {
              find . \
                -type f \
                \( -name '*.sh' -o -name '*.bash' -o -name '*.ksh' \) \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path './node_modules/*' \
                -printf '%P\0'

              git grep -Ilz '^#!.*\b\(ba\|da\|k\|z\)\?sh\b' -- \
                ':!vendor/**' \
                ':!node_modules/**' \
                || true
            } |
            sort -zu
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error::No shell files were found; ShellCheck did not scan code."
            exit 1
          fi

          printf 'Checking %d shell files\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"


  python:
    name: Python audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Python audit inputs
        id: python_inputs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.py' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print -quit |
            grep -q . || {
              echo "::error::No Python source was found to audit."
              exit 1
            }

          for file in requirements.txt requirements-audit.in requirements-audit.txt; do
            test -f "$file" || {
              echo "::error file=$file::Required Python dependency input is missing."
              exit 1
            }
          done
          grep -Eq '^[[:alnum:]][[:alnum:]_.-]*==' requirements-audit.txt || {
            echo "::error file=requirements-audit.txt::Python audit graph is empty or not fully resolved."
            exit 1
          }

      - name: Set up Python
        id: python_setup
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install audit tools
        id: python_tools
        if: always()
        continue-on-error: true
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements-audit.txt
          python -m pip check

      - name: Compile Python files
        id: python_compile
        if: always()
        continue-on-error: true
        run: python -m compileall -q .

      - name: Run Ruff
        id: ruff
        if: always()
        continue-on-error: true
        run: ruff check .

      - name: Run Bandit
        id: bandit
        if: always()
        continue-on-error: true
        run: |
          bandit \
            --recursive . \
            --exclude './vendor,./node_modules,./.git,./tests' \
            --severity-level medium \
            --confidence-level medium

      - name: Audit Python dependencies
        id: python_dependencies
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(requirements*.txt)

          if (( ${#files[@]} < 2 )); then
            echo "::error::Expected runtime and audit requirements files."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Auditing $file"
            pip-audit --requirement "$file"
          done

      - name: Enforce Python audit results
        if: always()
        shell: bash
        env:
          PYTHON_INPUTS_OUTCOME: ${{ steps.python_inputs.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python_setup.outcome }}
          PYTHON_TOOLS_OUTCOME: ${{ steps.python_tools.outcome }}
          PYTHON_COMPILE_OUTCOME: ${{ steps.python_compile.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          PYTHON_DEPENDENCIES_OUTCOME: ${{ steps.python_dependencies.outcome }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name=$1
            local outcome=$2
            if [[ "$outcome" != success ]]; then
              echo "::error::$name concluded with $outcome; success is required."
              failed=1
            fi
          }

          require_success python-inputs "$PYTHON_INPUTS_OUTCOME"
          require_success python-setup "$PYTHON_SETUP_OUTCOME"
          require_success python-tools "$PYTHON_TOOLS_OUTCOME"
          require_success python-compile "$PYTHON_COMPILE_OUTCOME"
          require_success ruff "$RUFF_OUTCOME"
          require_success bandit "$BANDIT_OUTCOME"
          require_success python-dependencies "$PYTHON_DEPENDENCIES_OUTCOME"
          exit "$failed"


  javascript:
    name: JavaScript audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate JavaScript audit inputs
        id: javascript_inputs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.js' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print -quit | grep -q . || {
              echo "::error::No JavaScript source was found to audit."
              exit 1
            }

          test -f package.json || {
            echo "::error file=package.json::Required npm manifest is missing."
            exit 1
          }
          test -f package-lock.json || {
            echo "::error file=package-lock.json::Required npm lock file is missing."
            exit 1
          }
          jq -e '.packages | length > 0' package-lock.json >/dev/null || {
            echo "::error file=package-lock.json::npm audit graph is empty or invalid."
            exit 1
          }
          jq -e '.scripts.lint | type == "string" and length > 0' \
            package.json >/dev/null || {
              echo "::error file=package.json::Required npm lint script is missing."
              exit 1
            }

      - name: Set up Node.js
        id: node_setup
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        id: javascript_syntax
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -type f \
            -name '*.js' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 |
          xargs -0 -r -n1 node --check

      - name: Install dependencies without lifecycle scripts
        id: npm_install
        if: always()
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Audit npm dependencies
        id: npm_audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run lint script
        id: npm_lint
        if: always()
        continue-on-error: true
        run: npm run lint

      - name: Enforce JavaScript audit results
        if: always()
        shell: bash
        env:
          JAVASCRIPT_INPUTS_OUTCOME: ${{ steps.javascript_inputs.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.node_setup.outcome }}
          JAVASCRIPT_SYNTAX_OUTCOME: ${{ steps.javascript_syntax.outcome }}
          NPM_INSTALL_OUTCOME: ${{ steps.npm_install.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          NPM_LINT_OUTCOME: ${{ steps.npm_lint.outcome }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name=$1
            local outcome=$2
            if [[ "$outcome" != success ]]; then
              echo "::error::$name concluded with $outcome; success is required."
              failed=1
            fi
          }

          require_success javascript-inputs "$JAVASCRIPT_INPUTS_OUTCOME"
          require_success node-setup "$NODE_SETUP_OUTCOME"
          require_success javascript-syntax "$JAVASCRIPT_SYNTAX_OUTCOME"
          require_success npm-install "$NPM_INSTALL_OUTCOME"
          require_success npm-audit "$NPM_AUDIT_OUTCOME"
          require_success npm-lint "$NPM_LINT_OUTCOME"
          exit "$failed"


  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and run actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail

          bash <(
            curl -fsSL \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          ) "${ACTIONLINT_VERSION}"

          ./actionlint -color
