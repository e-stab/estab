name: Security and Quality Audit

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p audit-results

      - name: List largest tracked files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-results

          git ls-files -z |
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              size=$(stat --format='%s' "$file")
              printf '%12d %s\n' "$size" "$file"
            fi
          done |
          sort -rn > audit-results/largest-tracked-files.txt

          echo "Largest tracked files:"
          sed -n '1,200p' audit-results/largest-tracked-files.txt

      - name: Reject very large tracked files
        shell: bash
        run: |
          set -euo pipefail

          maximum_size=$((20 * 1024 * 1024))
          failed=0

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            size=$(stat --format='%s' "$file")

            if (( size > maximum_size )); then
              echo "::error file=$file::Tracked file is larger than 20 MiB: $size bytes"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"

      - name: Find unexpected binary files
        shell: bash
        run: |
          set -euo pipefail

          : > audit-results/binary-files.txt

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue

            mime=$(file --brief --mime-type "$file")

            case "$mime" in
              text/*|application/json|application/xml|application/javascript|application/x-empty)
                ;;
              image/*|font/*|application/pdf)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
              *)
                printf '%s\t%s\n' "$mime" "$file" \
                  >> audit-results/binary-files.txt
                ;;
            esac
          done < <(git ls-files -z)

          cat audit-results/binary-files.txt

      - name: Find archives and executables
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Archives:"
            git ls-files |
              grep -Ei '\.(zip|tar|tgz|gz|bz2|xz|7z|rar|jar|war|phar)$' || true

            echo
            echo "Executable files:"
            git ls-files -s |
              awk '$1 == "100755" { print $4 }'
          } | tee audit-results/archives-and-executables.txt

      - name: Reject tracked dependency and build directories
        shell: bash
        run: |
          set -euo pipefail

          forbidden_pattern='(^|/)(node_modules|vendor|__pycache__|dist|build|coverage|\.pytest_cache|\.mypy_cache)(/|$)'

          matches=$(
            git ls-files |
            grep -E "$forbidden_pattern" || true
          )

          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "::error::Generated files or dependency directories are tracked."
            exit 1
          fi

      - name: Search for suspicious constructs
        shell: bash
        run: |
          set -euo pipefail

          pattern='
          (eval[[:space:]]*\()
          |(shell_exec[[:space:]]*\()
          |(passthru[[:space:]]*\()
          |(proc_open[[:space:]]*\()
          |(popen[[:space:]]*\()
          |(system[[:space:]]*\()
          |(exec[[:space:]]*\()
          |(base64_decode[[:space:]]*\()
          |(assert[[:space:]]*\()
          |(unserialize[[:space:]]*\()
          |(subprocess\.)
          |(os\.system[[:space:]]*\()
          |(child_process)
          |(Runtime\.getRuntime)
          |(ProcessBuilder)
          |(/etc/shadow)
          |(authorized_keys)
          |(crontab)
          |(systemctl)
          |(curl[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          |(wget[^[:alnum:]].*\|[[:space:]]*(ba)?sh)
          '

          compact_pattern=$(echo "$pattern" | tr -d '\n ')

          git grep -nI -E \
            "$compact_pattern" -- . \
            | tee audit-results/suspicious-constructs.txt \
            || true

          echo
          echo "These findings require review and are not automatically vulnerabilities."

      - name: Upload repository reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-hygiene
          path: audit-results/
          retention-days: 14


  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Semgrep
        run: pipx install semgrep==1.172.0

      - name: Run Semgrep
        shell: bash
        run: |
          set -o pipefail

          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/php \
            --config p/python \
            --config p/javascript \
            --config .semgrep/suspicious.yml \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 14

    permissions:
      contents: read
      security-events: write


  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect \
            --source=. \
            --verbose \
            --redact \
            --exit-code=1


  php:
    name: PHP audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect PHP project
        id: php
        shell: bash
        run: |
          if find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print -quit |
            grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.php.outputs.present == 'true'
        id: php_setup
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: phpstan, phpcs
          extensions: mbstring, json

      - name: Check PHP syntax
        id: php_syntax
        if: always() && steps.php.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type f \
            -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 |
          xargs -0 -r -n1 php -l

      - name: Run PHPStan
        id: phpstan
        if: always() && steps.php.outputs.present == 'true'
        continue-on-error: true
        run: |
          if [[ -f phpstan.neon || -f phpstan.neon.dist ]]; then
            phpstan analyse --no-progress
          else
            phpstan analyse \
              --no-progress \
              --level=5 \
              --memory-limit=1G \
              .
          fi

      - name: Run PHP_CodeSniffer
        id: phpcs
        if: always() && steps.php.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f phpcs.xml || -f phpcs.xml.dist ]]; then
            phpcs
          else
            echo "::notice::No phpcs.xml found; PHPCS is not enforced yet."
          fi

      - name: Enforce PHP audit results
        if: always() && steps.php.outputs.present == 'true'
        shell: bash
        env:
          PHP_SETUP_OUTCOME: ${{ steps.php_setup.outcome }}
          PHP_SYNTAX_OUTCOME: ${{ steps.php_syntax.outcome }}
          PHPSTAN_OUTCOME: ${{ steps.phpstan.outcome }}
          PHPCS_OUTCOME: ${{ steps.phpcs.outcome }}
        run: |
          set -euo pipefail
          failed=0

          accept_success_or_skip() {
            local name=$1
            local outcome=$2
            case "$outcome" in
              success|skipped) ;;
              *)
                echo "::error::$name concluded with $outcome."
                failed=1
                ;;
            esac
          }

          accept_success_or_skip php-setup "$PHP_SETUP_OUTCOME"
          accept_success_or_skip php-syntax "$PHP_SYNTAX_OUTCOME"
          accept_success_or_skip phpstan "$PHPSTAN_OUTCOME"
          accept_success_or_skip phpcs "$PHPCS_OUTCOME"
          exit "$failed"


  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            {
              find . \
                -type f \
                \( -name '*.sh' -o -name '*.bash' -o -name '*.ksh' \) \
                -not -path './.git/*' \
                -not -path './vendor/*' \
                -not -path './node_modules/*' \
                -printf '%P\0'

              git grep -Ilz '^#!.*\b\(ba\|da\|k\|z\)\?sh\b' -- \
                ':!vendor/**' \
                ':!node_modules/**' \
                || true
            } |
            sort -zu
          )

          if (( ${#files[@]} == 0 )); then
            echo "No shell scripts found."
            exit 0
          fi

          printf 'Checking %d shell files\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"


  python:
    name: Python audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect Python project
        id: python
        shell: bash
        run: |
          if find . -type f -name '*.py' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print -quit |
            grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python.outputs.present == 'true'
        id: python_setup
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install audit tools
        id: python_tools
        if: always() && steps.python.outputs.present == 'true'
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: Compile Python files
        id: python_compile
        if: always() && steps.python.outputs.present == 'true'
        continue-on-error: true
        run: python -m compileall -q .

      - name: Run Ruff
        id: ruff
        if: always() && steps.python.outputs.present == 'true'
        continue-on-error: true
        run: ruff check .

      - name: Run Bandit
        id: bandit
        if: always() && steps.python.outputs.present == 'true'
        continue-on-error: true
        run: |
          bandit \
            --recursive . \
            --exclude './vendor,./node_modules,./.git,./tests' \
            --severity-level medium \
            --confidence-level medium

      - name: Enforce Python audit results
        if: always() && steps.python.outputs.present == 'true'
        shell: bash
        env:
          PYTHON_SETUP_OUTCOME: ${{ steps.python_setup.outcome }}
          PYTHON_TOOLS_OUTCOME: ${{ steps.python_tools.outcome }}
          PYTHON_COMPILE_OUTCOME: ${{ steps.python_compile.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
        run: |
          set -euo pipefail
          failed=0

          accept_success_or_skip() {
            local name=$1
            local outcome=$2
            case "$outcome" in
              success|skipped) ;;
              *)
                echo "::error::$name concluded with $outcome."
                failed=1
                ;;
            esac
          }

          accept_success_or_skip python-setup "$PYTHON_SETUP_OUTCOME"
          accept_success_or_skip python-tools "$PYTHON_TOOLS_OUTCOME"
          accept_success_or_skip python-compile "$PYTHON_COMPILE_OUTCOME"
          accept_success_or_skip ruff "$RUFF_OUTCOME"
          accept_success_or_skip bandit "$BANDIT_OUTCOME"
          exit "$failed"


  javascript:
    name: JavaScript audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect JavaScript project
        id: javascript
        shell: bash
        run: |
          if find . -type f -name '*.js' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print -quit | grep -q .; then
            echo "source_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        id: node_setup
        if: steps.javascript.outputs.source_present == 'true'
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        id: javascript_syntax
        if: always() && steps.javascript.outputs.source_present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -type f \
            -name '*.js' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 |
          xargs -0 -r -n1 node --check

      - name: Enforce JavaScript audit results
        if: always() && steps.javascript.outputs.source_present == 'true'
        shell: bash
        env:
          NODE_SETUP_OUTCOME: ${{ steps.node_setup.outcome }}
          JAVASCRIPT_SYNTAX_OUTCOME: ${{ steps.javascript_syntax.outcome }}
        run: |
          set -euo pipefail
          failed=0

          accept_success_or_skip() {
            local name=$1
            local outcome=$2
            case "$outcome" in
              success|skipped) ;;
              *)
                echo "::error::$name concluded with $outcome."
                failed=1
                ;;
            esac
          }

          accept_success_or_skip node-setup "$NODE_SETUP_OUTCOME"
          accept_success_or_skip javascript-syntax "$JAVASCRIPT_SYNTAX_OUTCOME"
          exit "$failed"
