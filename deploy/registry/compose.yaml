name: ${COMPOSE_PROJECT_NAME:-estab}

services:
  db:
    image: mariadb:11.8.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    init: true
    # Eine harte Grenze, damit ein Ausreisser nur seinen eigenen Dienst
    # trifft und nicht das ganze Geraet.
    #
    # Nachgemessen mit dem echten Schema und echten Daten: Bei 24
    # gleichzeitigen Verbindungen -- der Obergrenze oben -- laeuft der
    # Verbrauch auf 170 MB und bleibt dort, ueber drei Durchgaenge zu je
    # 40 Laeufen, ohne ein einziges OOM-Ereignis.
    #
    # 192 MB haetten daraus 11 Prozent Reserve gemacht. Das ist zu wenig:
    # MariaDB streut ueber Tage im Speicherallokator -- auf der laufenden
    # Instanz lag es nach 3,9 Tagen rund 190 MB ueber dem, was es selbst
    # als belegt meldete. 256 MB lassen ein Drittel Luft und bleiben mit
    # dem app-Dienst zusammen deutlich unter dem Geraetebudget.
    #
    # Wird die Grenze doch zu knapp, startet der Dienst neu statt langsam
    # zu werden -- das ist gewollt und sichtbar.
    mem_limit: 256m
    restart: unless-stopped
    command:
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      # Auf den gemessenen Bedarf statt auf die Vorgabewerte.
      #
      # Der Datenbestand umfasst 11,4 MB in 104 Tabellen, alle InnoDB.
      # Reserviert waren dafuer 400 MB Puffer, von denen die Datenbank
      # selbst meldete, sie nicht zu brauchen: KEY_BLOCKS_USED = 0 (der
      # MyISAM-Cache wird nie angefasst), 292 von 15.924 Aria-Bloecken
      # belegt, 1.058 Plattenlesungen auf 10.011.157 Anfragen. In 3,9
      # Tagen standen hoechstens 7 der 151 Verbindungen gleichzeitig.
      #
      # Im Lasttest mit 20.000 Nachrichten und 20 gleichzeitigen
      # Verbindungen war dieses Profil zugleich das schnellste: 0,591 s
      # je Durchlauf gegen 0,689 s bei den Vorgabewerten.
      #
      # Waechst der Bestand ueber etwa 60 MB, muss der Pufferpool wieder
      # mitwachsen -- dann ist er der erste Wert, den man anhebt.
      - --key-buffer-size=1M
      - --aria-pagecache-buffer-size=8M
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=2M
      - --innodb-log-file-size=32M
      - --max-connections=24
      - --thread-cache-size=8
      - --table-open-cache=256
      - --table-definition-cache=256
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --sort-buffer-size=256K
      - --join-buffer-size=128K
      - --read-rnd-buffer-size=128K
      - --innodb-read-io-threads=2
      - --innodb-write-io-threads=2
      - --innodb-purge-threads=1
    environment:
      MARIADB_DATABASE: ${ESTAB_DB_NAME:-estab}
      MARIADB_USER: ${ESTAB_DB_USER:-estab}
      MARIADB_PASSWORD_FILE: /run/secrets/estab_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/estab_db_root_password
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${ESTAB_DB_DATA_SOURCE:-estab_db}:/var/lib/mysql:Z
      - ${ESTAB_DB_PASSWORD_SECRET_FILE:-./secrets/db_password.txt}:/run/secrets/estab_db_password:ro,z
      - ${ESTAB_DB_ROOT_PASSWORD_SECRET_FILE:-./secrets/db_root_password.txt}:/run/secrets/estab_db_root_password:ro,z
    networks:
      - database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${ESTAB_MIGRATE_IMAGE:?Set ESTAB_MIGRATE_IMAGE to an immutable release tag or digest}
    init: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ESTAB_DB_HOST: db
      ESTAB_DB_PORT: "3306"
      ESTAB_DB_NAME: ${ESTAB_DB_NAME:-estab}
      ESTAB_DB_ROOT_PASSWORD_FILE: /run/secrets/estab_db_root_password
    volumes:
      - ${ESTAB_DB_ROOT_PASSWORD_SECRET_FILE:-./secrets/db_root_password.txt}:/run/secrets/estab_db_root_password:ro,z
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  admin-auth-init:
    image: ${ESTAB_APP_IMAGE:?Set ESTAB_APP_IMAGE to an immutable release tag or digest}
    init: true
    restart: "no"
    entrypoint:
      - estab-init-admin-auth
    environment:
      ESTAB_ADMIN_USER: ${ESTAB_ADMIN_USER:-estab-admin}
      ESTAB_ADMIN_PASSWORD_FILE: /run/secrets/estab_admin_password
    volumes:
      - estab_auth:/var/lib/estab/auth:z
      - ${ESTAB_ADMIN_PASSWORD_SECRET_FILE:-./secrets/admin_password.txt}:/run/secrets/estab_admin_password:ro,Z
    network_mode: none
    security_opt:
      - no-new-privileges:true

  app:
    image: ${ESTAB_APP_IMAGE:?Set ESTAB_APP_IMAGE to an immutable release tag or digest}
    init: true
    # 12 Arbeitsprozesse zu je 128 MB. Im Regelfall traegt das eine
    # laufende PDF-Ausgabe (rund 90 MB) plus elf gewoehnliche
    # Seitenaufbauten. Mehrere gleichzeitige Ausgaben schliesst die
    # Anwendung selbst aus (siehe app/incident_pdf.php).
    mem_limit: 448m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      admin-auth-init:
        condition: service_completed_successfully
    environment:
      ESTAB_DB_HOST: db
      ESTAB_DB_PORT: "3306"
      ESTAB_DB_USER: ${ESTAB_DB_USER:-estab}
      ESTAB_DB_PASSWORD_FILE: /run/secrets/estab_db_password
      ESTAB_DB_NAME: ${ESTAB_DB_NAME:-estab}
      ESTAB_BASE_PATH: ${ESTAB_BASE_PATH:-}
      ESTAB_PUBLIC_URL: ${ESTAB_PUBLIC_URL:-/}
      ESTAB_AUTHORITY_CODE: ${ESTAB_AUTHORITY_CODE:-EL}
      ESTAB_ALLOW_SELF_REGISTRATION: ${ESTAB_ALLOW_SELF_REGISTRATION:-false}
      ESTAB_ALLOW_LEGACY_LOGIN_WITHOUT_CSRF: ${ESTAB_ALLOW_LEGACY_LOGIN_WITHOUT_CSRF:-false}
      ESTAB_TRUST_PROXY_HEADERS: ${ESTAB_TRUST_PROXY_HEADERS:-false}
      ESTAB_TRUSTED_PROXIES: ${ESTAB_TRUSTED_PROXIES:-}
      ESTAB_UPLOAD_MAX_BYTES: ${ESTAB_UPLOAD_MAX_BYTES:-20971520}
      ESTAB_PDF_ATTACHMENT_MAX_BYTES: ${ESTAB_PDF_ATTACHMENT_MAX_BYTES:-52428800}
      ESTAB_EXPORT_DIR: /var/lib/estab/export
      ESTAB_ADMIN_USER: ${ESTAB_ADMIN_USER:-estab-admin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${ESTAB_APP_DATA_SOURCE:-estab_data}:/var/www/html/4fdata:z
      - ${ESTAB_EXPORT_DATA_SOURCE:-estab_export}:/var/lib/estab/export:z
      - estab_auth:/run/estab-auth:ro,z
      - ${ESTAB_DB_PASSWORD_SECRET_FILE:-./secrets/db_password.txt}:/run/secrets/estab_db_password:ro,z
    ports:
      - "${ESTAB_HTTP_BIND:-127.0.0.1}:${ESTAB_HTTP_PORT:-8080}:8080"
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD", "estab-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  estab_db:
  estab_data:
  estab_export:
  estab_auth:

networks:
  frontend:
  database:
    internal: true
